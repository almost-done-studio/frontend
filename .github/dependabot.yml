version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      phaser:
        patterns:
          - phaser
      capacitor:
        patterns:
          - "@capacitor/*"
      dev-tooling:
        patterns:
          - vite
          - typescript
          - "eslint*"
          - vitest
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
