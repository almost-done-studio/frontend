name: PR Description Check

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: require What + Why sections
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            if (context.actor === 'dependabot[bot]') {
              core.info('Skipping What/Why requirement for Dependabot')
              return
            }
            const body = context.payload.pull_request.body || ''
            const missing = []
            if (!/^##\s*what\b/im.test(body)) missing.push('## What')
            if (!/^##\s*why\b/im.test(body)) missing.push('## Why')
            if (missing.length > 0) {
              core.setFailed(
                `PR description is missing: ${missing.join(', ')}\n\n` +
                  'Required format:\n## What\n...\n\n## Why\n...'
              )
            }
