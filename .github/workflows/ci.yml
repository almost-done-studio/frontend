name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: lint · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for Node app lockfile
        id: app
        run: |
          if [ -f package-lock.json ] && [ -f package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No package.json / package-lock.json yet — skipping lint/test/build."
            echo "Add the Vite app bootstrap, then this job will run fully."
          fi

      - uses: actions/setup-node@v7
        if: steps.app.outputs.ready == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.app.outputs.ready == 'true'
        run: npm ci

      - name: Lint
        if: steps.app.outputs.ready == 'true'
        run: npm run lint

      - name: Test
        if: steps.app.outputs.ready == 'true'
        run: npm run test -- --run

      - name: Build
        if: steps.app.outputs.ready == 'true'
        run: npm run build
